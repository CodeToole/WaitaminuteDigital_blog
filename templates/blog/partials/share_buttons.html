{% load blog_tags %}
<div class="share-bar {% if layout == 'vertical' %}share-bar--vertical{% endif %} {% if custom_class %}{{ custom_class }}{% endif %}" data-post-url="{{ post_url|default:request.build_absolute_uri }}" data-post-title="{{ post.title }}">
  <span class="share-bar-label">Share:</span>
  <div class="share-bar-buttons">
    <!-- Facebook -->
    <a href="{% firstof share_urls.facebook post|facebook_share_url:request %}"
       class="share-btn share-btn-facebook"
       target="_blank"
       rel="noopener noreferrer"
       title="Share on Facebook"
       aria-label="Share on Facebook">
      <svg class="share-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      <span class="share-btn-label">Facebook</span>
    </a>

    <!-- X (Twitter) -->
    <a href="{% firstof share_urls.x share_urls.twitter post|x_share_url:request %}"
       class="share-btn share-btn-x"
       target="_blank"
       rel="noopener noreferrer"
       title="Share on X (Twitter)"
       aria-label="Share on X (Twitter)">
      <svg class="share-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 24.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      <span class="share-btn-label">X</span>
    </a>

    <!-- LinkedIn -->
    <a href="{% firstof share_urls.linkedin post|linkedin_share_url:request %}"
       class="share-btn share-btn-linkedin"
       target="_blank"
       rel="noopener noreferrer"
       title="Share on LinkedIn"
       aria-label="Share on LinkedIn">
      <svg class="share-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
      </svg>
      <span class="share-btn-label">LinkedIn</span>
    </a>

    <!-- Copy Link -->
    <button type="button"
            class="share-btn share-btn-copy"
            data-url="{{ post_url|default:request.build_absolute_uri }}"
            title="Copy link to clipboard"
            aria-label="Copy link to clipboard">
      <svg class="share-icon icon-link" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
      </svg>
      <svg class="share-icon icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span class="share-btn-label">Copy Link</span>
    </button>
  </div>
  <div class="sr-only share-live-status" aria-live="polite"></div>
</div>
<script>
  (function() {
    if (window._wmdShareInit) return;
    window._wmdShareInit = true;
    document.addEventListener('click', function(e) {
      var btn = e.target.closest('.share-btn-copy');
      if (!btn) return;
      e.preventDefault();
      var url = btn.getAttribute('data-url') || window.location.href;
      var label = btn.querySelector('.share-btn-label');
      var originalText = label ? label.textContent : 'Copy Link';
      var container = btn.closest('.share-bar');
      var statusLive = container ? container.querySelector('.share-live-status') : null;

      function markCopied() {
        btn.classList.add('copied');
        if (label) label.textContent = 'Copied!';
        if (statusLive) statusLive.textContent = 'Link copied to clipboard';
        setTimeout(function() {
          btn.classList.remove('copied');
          if (label) label.textContent = originalText;
          if (statusLive) statusLive.textContent = '';
        }, 2000);
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(markCopied).catch(function() {
          fallbackCopy(url, markCopied);
        });
      } else {
        fallbackCopy(url, markCopied);
      }
    });

    function fallbackCopy(text, callback) {
      var textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      textArea.style.top = '-999999px';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        if (callback) callback();
      } catch (err) {
        console.error('Fallback copy failed: ', err);
      }
      document.body.removeChild(textArea);
    }
  })();
</script>
